<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a0b0d">
<title>PrintView</title>
<style>
:root{--bg:#0b0c0e;--s1:#141619;--s2:#1c1f23;--s3:#24282d;--line:#2a2e34;--line2:#353a41;--tx:#f2f0eb;--mu:#9097a1;--fa:#5f656e;
--ac:#ffb224;--ac2:#ffc65c;--acbg:#ffb2241a;--ok:#34d399;--okbg:#34d3991a;--bad:#ff5d55;--badbg:#ff5d551a;--info:#6aa9ff;--r:18px;--r2:12px;
--sh:0 1px 0 #ffffff08 inset,0 8px 24px -12px #000c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 500px at 70% -200px,#ffb2240d,transparent 70%),var(--bg);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:#ffb22455}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
header h1{font-size:21px;margin:0;font-weight:700;letter-spacing:-.02em;flex:1;display:flex;align-items:center;gap:10px}
header h1:before{content:"";width:10px;height:10px;border-radius:3px;background:var(--ac);box-shadow:0 0 12px var(--ac)}
#conn{font-size:13px;color:var(--mu);background:var(--s1);border:1px solid var(--line);padding:6px 12px;border-radius:99px}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.grid>*{min-width:0}
@media(min-width:960px){.grid.unlocked{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}.grid.unlocked .camcol{position:sticky;top:16px}}
.cam{position:relative;background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:16/9;box-shadow:0 0 0 1px var(--line),0 20px 50px -25px #000}
.cam img{width:100%;height:100%;object-fit:contain;display:block}
.cam .scrim{position:absolute;inset:0;background:linear-gradient(#0008,transparent 30%,transparent 70%,#0009);pointer-events:none}
.pill{position:absolute;top:12px;left:12px;background:#000a;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:6px 12px;border-radius:99px;font-size:11.5px;font-weight:700;letter-spacing:.08em;border:1px solid #ffffff14}
#live{left:auto;right:12px;color:#ff6b63}
.cambtns{position:absolute;right:12px;bottom:12px;display:flex;gap:8px}
.ib{width:42px;height:42px;border-radius:99px;border:1px solid #ffffff1a;background:#000a;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;cursor:pointer;transition:background .15s,transform .1s}
.ib:hover{background:#000d}.ib:active{transform:scale(.94)}.ib svg{width:21px;height:21px}
.camover{position:absolute;left:16px;right:16px;bottom:14px;display:none;align-items:flex-end;gap:14px}
.cam:fullscreen{border-radius:0;aspect-ratio:auto}
.cam:fullscreen .camover{display:flex}.cam:fullscreen .cambtns{bottom:auto;top:12px;right:110px}
.card{background:linear-gradient(180deg,#ffffff05,transparent 40%),var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.card+.card{margin-top:12px}
.h{font-size:11.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--mu);margin:0 0 12px}
.row{display:flex;align-items:center;gap:10px}.row.w{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mu{color:var(--mu)}.fa{color:var(--fa)}.sm{font-size:13px}
.bar{height:8px;background:var(--s3);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:99px;transition:width .4s;box-shadow:0 0 12px #ffb22466}
.big{font-size:52px;font-weight:250;line-height:1;letter-spacing:-.03em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}.stat b{display:block;font-weight:600;font-size:17px;margin-top:3px}
.btn{border:1px solid var(--line2);border-radius:var(--r2);padding:12px 16px;font-weight:600;cursor:pointer;background:var(--s2);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;transition:background .15s,border-color .15s,transform .08s,box-shadow .15s;text-decoration:none;color:var(--tx)}
.btn:hover{background:var(--s3);border-color:#454b54}.btn:active{transform:translateY(1px)}
.btn:focus-visible,.tabs button:focus-visible,.seg button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.btn:disabled{opacity:.35;cursor:default;transform:none}
.btn.pri{background:linear-gradient(180deg,var(--ac2),var(--ac));border-color:transparent;color:#1a1206;box-shadow:0 6px 20px -8px #ffb224aa}
.btn.pri:hover{filter:brightness(1.05)}
.btn.go{background:var(--ok);border-color:transparent;color:#06180f}
.btn.bad{background:var(--badbg);border-color:#ff5d5533;color:var(--bad)}.btn.bad:hover{background:#ff5d552b}
.btn.sm{min-height:34px;padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn svg{width:18px;height:18px}
.seg{display:flex;background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;color:var(--mu);padding:9px 6px;border-radius:10px;font-weight:600;cursor:pointer;transition:background .15s,color .15s}
.seg button.on{background:var(--s3);color:var(--tx);box-shadow:0 1px 0 #ffffff10 inset}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:16px 0 12px;padding:4px;background:var(--s1);border:1px solid var(--line);border-radius:99px;position:sticky;top:8px;z-index:4;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;color:var(--mu);padding:9px 15px;border-radius:99px;font-weight:600;white-space:nowrap;cursor:pointer;transition:background .15s,color .15s}
.tabs button:hover{color:var(--tx)}
.tabs button.on{background:var(--tx);color:var(--bg)}
.sw{position:relative;width:46px;height:28px;flex:none}.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:var(--s3);border:1px solid var(--line2);border-radius:99px;transition:.2s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:var(--mu);border-radius:50%;transition:.2s}
.sw input:checked+span{background:#ffb22440;border-color:#ffb22466}.sw input:checked+span:before{transform:translateX(18px);background:var(--ac)}
.div{height:1px;background:var(--line);margin:16px 0}
input[type=number],input[type=text],input[type=password],input[type=datetime-local],input[type=time],input[type=date],select,textarea{background:var(--s2);border:1px solid var(--line2);border-radius:var(--r2);padding:10px 12px;outline:none;min-width:0;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px #ffb22426}
input[type=range]{width:100%;accent-color:var(--ac)}
textarea{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;min-height:80px;resize:vertical}
.ev{display:flex;gap:12px;padding-top:10px;align-items:flex-start}.ev i{width:7px;height:7px;border-radius:9px;margin-top:7px;flex:none;background:var(--fa)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{background:var(--s2);border:1px solid var(--line);outline:2px solid transparent;border-radius:14px;padding:10px;cursor:pointer;text-align:left;color:inherit;transition:outline-color .15s}
.slot.on{outline-color:var(--ac)}.slot.sel{outline-color:var(--info)}
.dot{width:22px;height:22px;border-radius:99px;border:2px solid #fff3;display:inline-block;vertical-align:middle}
.list>*{display:flex;gap:12px;align-items:center;padding:11px 10px;margin:0 -10px;border-top:1px solid var(--line);border-radius:12px;transition:background .12s}
.list>*:first-child{border-top:0}
.list>[data-i]:hover{background:var(--s2)}
.thumb{width:84px;height:56px;border-radius:10px;object-fit:cover;background:#000;flex:none;border:1px solid var(--line)}
.pad{display:grid;grid-template-columns:repeat(3,52px);gap:6px}
.pad .btn{min-height:52px;padding:0}
.lock{max-width:420px;margin:16px auto 0;text-align:center}
.lock input{font-size:26px;letter-spacing:.4em;text-align:center;width:100%;padding:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#22262bf2;border:1px solid var(--line2);backdrop-filter:blur(10px);padding:11px 18px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90vw;box-shadow:0 10px 30px -10px #000}
.toast.show{opacity:1;transform:translateX(-50%)}
.hide{display:none!important}
a{color:var(--info)}
.chip{background:var(--s2);border:1px solid var(--line);padding:5px 10px;border-radius:99px;font-size:12px;font-weight:600}
dialog{background:var(--s1);color:var(--tx);border:1px solid var(--line2);border-radius:var(--r);padding:22px;max-width:min(440px,92vw);width:100%;box-shadow:0 30px 80px -20px #000}
dialog::backdrop{background:#000b;backdrop-filter:blur(4px)}
label.ck{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer}
label.ck input{width:18px;height:18px;accent-color:var(--ac)}
details>summary{list-style:none}details>summary::-webkit-details-marker{display:none}
details>summary:before{content:"\25B8";display:inline-block;margin-right:6px;transition:transform .15s}details[open]>summary:before{transform:rotate(90deg)}
/* scheduler */
.sched{margin-top:12px;border:1px solid var(--line);border-radius:16px;background:var(--s2);padding:14px}
.sched .ttl{display:flex;align-items:center;gap:8px;font-weight:650;margin-bottom:10px}
.sched .ttl svg{width:18px;height:18px;color:var(--ac)}
.qrow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.qrow::-webkit-scrollbar{display:none}
.q{border:1px solid var(--line2);background:var(--s1);color:var(--tx);border-radius:99px;padding:8px 13px;font-weight:600;font-size:13.5px;white-space:nowrap;cursor:pointer;transition:.15s}
.q:hover{border-color:#4a505a}.q.on{background:var(--acbg);border-color:var(--ac);color:var(--ac2)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.day{border:1px solid var(--line2);background:var(--s1);border-radius:12px;padding:7px 0;text-align:center;cursor:pointer;transition:.15s}
.day small{display:block;font-size:10.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.day b{font-size:17px;font-weight:650}
.day.on{background:var(--acbg);border-color:var(--ac)}.day.on b{color:var(--ac2)}
.clock{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:12px}
.spin{display:flex;flex-direction:column;align-items:center;gap:2px}
.spin button{border:0;background:transparent;color:var(--mu);width:44px;height:26px;border-radius:8px;cursor:pointer;font-size:14px}.spin button:hover{background:var(--s3);color:var(--tx)}
.spin output{font-size:34px;font-weight:300;font-variant-numeric:tabular-nums;min-width:58px;text-align:center;letter-spacing:-.02em}
.clock .colon{font-size:30px;color:var(--fa);margin-top:-4px}
.ampm{display:flex;flex-direction:column;gap:4px;margin-left:6px}
.ampm button{border:1px solid var(--line2);background:var(--s1);border-radius:8px;padding:4px 9px;font-size:12px;font-weight:700;cursor:pointer;color:var(--mu)}.ampm button.on{background:var(--acbg);border-color:var(--ac);color:var(--ac2)}
.when{margin-top:12px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--s1);border:1px dashed var(--line2)}
.when b{flex:1}.when span{color:var(--mu);font-size:13px}
.sjob{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--s2);margin-top:8px}
.sjob .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--acbg);color:var(--ac);flex:none}
.sjob .ic svg{width:19px;height:19px}
.sjob .cd{font-variant-numeric:tabular-nums;font-weight:650;color:var(--ac2)}
.sjob.done .ic{background:var(--okbg);color:var(--ok)}.sjob.fail .ic{background:var(--badbg);color:var(--bad)}
/* view-only: everything visible, nothing changeable */
.ro #views .btn,.ro #views input[type=number],.ro #views textarea,.ro #views label.ck input,.ro .ro-hide{display:none!important}
.ro #views input,.ro #views select,.ro #views .seg,.ro #views .sw,.ro #views .slot{pointer-events:none}
.ro #views .sw{opacity:.75}
.robar{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-top:14px;font-size:13px;color:var(--mu)}
.pthumb{width:52px;height:52px;flex:none;border-radius:10px;background:var(--s2);object-fit:contain;margin-right:12px}
.v3d-wait{height:var(--v3d-h,380px);display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;border-radius:14px;background:var(--s2);color:var(--mu)}
@media (max-width:600px){#p3d{--v3d-h:300px}}
.flow{margin:10px 0 0;max-height:340px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font:11.5px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>PrintView</h1>
    <span id="conn"></span>
    <button class="btn sm hide" id="lockBtn" title="Lock this browser">Lock</button>
  </header>

  <div class="grid" id="grid">
    <div class="camcol">
      <div class="cam" id="cam">
        <img id="img" alt="Printer camera">
        <div class="scrim"></div>
        <div class="pill" id="state">CONNECTING</div>
        <div class="pill hide" id="live">● LIVE</div>
        <div class="cambtns">
          <button class="ib hide" id="lightBtn" title="Chamber light"></button>
          <button class="ib" id="fsBtn" title="Full screen"></button>
        </div>
        <div class="camover" id="camover">
          <div class="big num" id="fsPct">--%</div>
          <div class="grow" style="padding-bottom:6px"><div class="num" id="fsLeft" style="font-weight:600"></div><div class="mu sm num" id="fsStats"></div></div>
          <button class="btn pri hide" id="fsPause"></button>
        </div>
      </div>
      <div class="lock card hide" id="lockCard">
        <div class="h" style="margin-bottom:6px" id="lockTitle">Controls locked</div>
        <div class="mu sm" style="margin-bottom:14px" id="lockMsg">Have the access code? Enter it to control the printer.</div>
        <form id="loginForm"><input id="code" type="password" inputmode="numeric" autocomplete="current-password" maxlength="32" placeholder="••••••">
        <button class="btn pri" style="width:100%;margin-top:10px">Unlock</button></form>
        <div class="sm" id="loginMsg" style="color:var(--bad);margin-top:10px;min-height:1.4em"></div>
      </div>
    </div>

    <div id="panel">
      <div class="robar hide" id="robar"><span class="grow" id="roTxt">View only. You can see everything but can't change anything.</span><button class="btn sm pri" id="roCode">Enter code</button></div>
      <div class="tabs" id="tabs"></div>
      <div id="views"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<dialog id="dlg"><div id="dlgBody"></div></dialog>

<script>
// VIEWER3D-BEGIN
// PrintView 3D toolpath viewer. No libraries (the web link's CSP blocks CDNs), plain WebGL 1.
// PV3D.mount(el, arrayBuffer) draws a PV3D toolpath (see app/gcode3d.py) into el.
(function () {
  const FEATS = [["Outer wall", "#ff8a3d"], ["Inner wall", "#ffd25e"], ["Infill", "#d9483b"],
    ["Top / bottom", "#a46be0"], ["Support", "#4fc28a"], ["Other", "#8c96a3"]];
  const CSS = `.v3d{position:relative;height:var(--v3d-h,380px);border-radius:14px;overflow:hidden;background:var(--s2,#1b1f24);touch-action:none;user-select:none;-webkit-user-select:none}
.v3d canvas{width:100%;height:100%;display:block;cursor:grab}.v3d canvas:active{cursor:grabbing}
.v3d-leg{position:absolute;left:8px;top:8px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 84px)}
.v3d-leg button{font:600 12px/1 system-ui,sans-serif;padding:6px 9px;border-radius:99px;border:0;background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;gap:6px;cursor:pointer}
.v3d-leg button i{width:10px;height:10px;border-radius:3px;display:inline-block}.v3d-leg button.off{opacity:.4}.v3d-leg button.off i{background:transparent!important;outline:1.5px solid #fff}
.v3d-rs{position:absolute;right:8px;top:8px;font:600 12px/1 system-ui,sans-serif;padding:7px 10px;border-radius:99px;border:0;background:rgba(0,0,0,.45);color:#fff;cursor:pointer}
.v3d-hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font:12px system-ui,sans-serif;color:rgba(255,255,255,.7);pointer-events:none;transition:opacity .6s}
.v3d-ctl{display:flex;align-items:center;gap:10px;margin-top:10px}.v3d-ctl input{flex:1;accent-color:var(--ac,#ff8a3d)}
.v3d-ctl span{font:600 13px system-ui,sans-serif;min-width:96px;text-align:right;font-variant-numeric:tabular-nums;color:var(--tx,inherit)}
.v3d-ctl button{font:600 13px system-ui,sans-serif;width:38px;height:34px;border-radius:10px;border:0;background:var(--s2,#262b31);color:var(--tx,#fff);cursor:pointer}
.v3d-msg{display:flex;height:100%;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--mu,#9aa3ad);font:14px system-ui,sans-serif}`;

  function hex(h) { return [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16) / 255); }
  function persp(fy, a, n, f) { const t = 1 / Math.tan(fy / 2), d = n - f; return [t / a, 0, 0, 0, 0, t, 0, 0, 0, 0, (f + n) / d, -1, 0, 0, 2 * f * n / d, 0]; }
  function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
  function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
  function norm(a) { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }
  function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
  function look(e, c, u) {
    const z = norm(sub(e, c)), x = norm(cross(u, z)), y = cross(z, x);
    return [x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -dot(x, e), -dot(y, e), -dot(z, e), 1];
  }
  function mul(a, b) { const o = new Array(16); for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + j] * b[i * 4 + k]; o[i * 4 + j] = s; } return o; }

  function prog(gl, vs, fs) {
    const p = gl.createProgram();
    for (const [t, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
      const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      gl.attachShader(p, s);
    }
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    return p;
  }

  const VS = `precision highp float;
attribute vec3 p; attribute float f; attribute float l;
uniform mat4 mvp; uniform mat4 mv; uniform float vis[6]; uniform vec3 col[6]; uniform float top; uniform vec2 fog;
varying vec3 c;
void main(){
  int fi = int(f + 0.5); float v = 0.0; vec3 cc = vec3(0.6);
  for (int i = 0; i < 6; i++) { if (i == fi) { v = vis[i]; cc = col[i]; } }
  vec4 w = vec4(p / 50.0, 1.0);
  if (v < 0.5) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); c = cc; return; }
  gl_Position = mvp * w;
  float d = clamp((-(mv * w).z - fog.x) / fog.y, 0.0, 1.0);
  float band = 0.86 + 0.14 * mod(l, 2.0);
  if (l > top - 0.5) cc = mix(cc, vec3(1.0), 0.45);
  c = cc * band * (1.08 - 0.55 * d);
}`;
  const FS = `precision mediump float; varying vec3 c; void main(){ gl_FragColor = vec4(c, 1.0); }`;
  const BVS = `precision highp float; attribute vec3 p; uniform mat4 mvp; void main(){ gl_Position = mvp * vec4(p, 1.0); }`;
  const BFS = `precision mediump float; uniform vec4 col; void main(){ gl_FragColor = col; }`;

  function parse(buf) {
    const dv = new DataView(buf);

    const f = inp.files[0]; if (!f) return;

// bed servo (Arduino) status: a line under the stats, and a red banner on every tab when heating is cut
function hmsBox(h) {
  const items = (h && h.items) || [];
  let box = $("#hmsBox");
  if (!box) {
    box = document.createElement("div"); box.id = "hmsBox";
    box.style.cssText = "border:1px solid var(--bad);border-radius:12px;padding:10px 14px;margin-top:14px";
    $("#tabs").parentNode.insertBefore(box, $("#tabs"));
  }
  box.style.display = items.length ? "" : "none";
  const e = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  box.innerHTML = items.length ? `<div style="font-weight:700;margin-bottom:4px">Printer errors (${items.length})</div>` + items.map(i =>
    `<div style="padding:6px 0;border-top:1px solid rgba(255,255,255,.08)"><div style="font-size:12px;opacity:.7"><b style="color:var(--bad)">${e(i.level)}</b> · ${i.url ? `<a href="${i.url}" target="_blank" rel="noopener" style="color:inherit">HMS_${e(i.code)}</a>` : e(i.code)}</div><div style="font-size:14px">${e(i.text)}</div></div>`).join("") : "";
}
function bedServo(b) { window._bc = b;
  let ban = $("#bcBan");
  if (!ban) {
    ban = document.createElement("div"); ban.id = "bcBan";
    ban.style.cssText = "background:var(--bad);color:#fff;border-radius:12px;padding:10px 14px;margin-top:14px;font-weight:600;font-size:14px";
    $("#tabs").parentNode.insertBefore(ban, $("#tabs"));
  }
  if (!b || !b.enabled) { ban.classList.add("hide"); return; }
  const msg = b.fault ? "Bed servo FAULT (heating held off): " + b.fault : b.alert && b.bed_target > 0 ? "Bed heating off: " + b.alert : "";
  ban.textContent = msg; ban.classList.toggle("hide", !msg);
  $("#fsStats").textContent += ` · Bed servo ${b.fault ? "FAULT" : b.state === "close" ? "🔥 heating" : "🧊 off"}${b.uno ? "" : " (Uno no reply)"}`;
}

// Pressure advance: type a K you already know, it's saved on the printer and assigned to the slot.
async function paDialog(t) {
  const d = $("#dlg"), where = t.slot === 254 ? "external spool" : `AMS ${t.unit} · slot ${t.tray}`;
  const cur = t.k != null && t.k >= 0 ? t.k.toFixed(3) : "";
  $("#dlgBody").innerHTML = `<div style="font-size:18px;font-weight:650;margin-bottom:6px">Pressure advance · ${esc(where)}</div>
    <div class="mu sm" style="margin-bottom:12px">${esc(t.type || "No material set")} · current K ${cur || "not reported"}</div>
    <div class="row" style="margin-bottom:8px"><input type="number" id="pK" step="0.001" min="0" max="2" placeholder="K, e.g. 0.032" value="${cur}" style="width:130px">
      <input type="text" id="pN" maxlength="40" placeholder="Name (optional)" class="grow"></div>
    <div class="row" style="justify-content:flex-end;margin-bottom:14px"><button class="btn sm" id="pNo">Close</button><button class="btn sm pri" id="pOk">Save K</button></div>
    <div class="h">Saved on the printer</div><div class="list" id="pList"><div class="mu sm">Loading...</div></div>`;
  $("#pNo").onclick = () => d.close();
  const send = async (body, msg) => { try { await api("/api/pa", body); toast(msg); d.close(); } catch (e) { toast(e.message); } };
  $("#pOk").onclick = () => {
    const k = parseFloat($("#pK").value);
    if (!(k >= 0 && k <= 2)) return toast("Type a K value (usually 0.01–0.1)");
    send({action: "set", slot: t.slot, k, name: $("#pN").value.trim()}, "K " + k.toFixed(3) + " saved to this slot");
  };
  d.showModal();
  try {
    const r = await api("/api/pa");
    if (!r.table) { $("#pList").innerHTML = '<div class="mu sm">Your firmware keeps K on each slot (no saved list). Saving writes it straight to this slot.</div>'; return; }
    const rows = (r.entries || []).filter(e => !t.idx || e.filament_id === t.idx);
    $("#pList").innerHTML = rows.length ? rows.map(e => `<div><div class="grow"><div style="font-weight:600${e.cali_idx === t.cali_idx ? ";color:var(--ac)" : ""}">${esc(e.name)}</div>
        <div class="fa sm">K ${e.k.toFixed(3)}${e.cali_idx === t.cali_idx ? " · in use" : ""}</div></div>
        <button class="btn sm" data-puse="${e.cali_idx}" data-pf="${esc(e.filament_id)}">Use</button><button class="btn sm bad" data-pdel="${e.cali_idx}" data-pf="${esc(e.filament_id)}">✕</button></div>`).join("")
      : '<div class="mu sm">None saved for this material yet.</div>';
    $("#pList").querySelectorAll("[data-puse]").forEach(b => b.onclick = () => send({action: "select", slot: t.slot, cali_idx: +b.dataset.puse, filament_id: b.dataset.pf}, "Slot updated"));
    $("#pList").querySelectorAll("[data-pdel]").forEach(b => b.onclick = () => send({action: "delete", cali_idx: +b.dataset.pdel, filament_id: b.dataset.pf}, "Deleted"));
  } catch (e) { $("#pList").innerHTML = `<div style="color:var(--bad)" class="sm">${esc(e.message)}</div>`; }
}
function editSlot(t) {
  const d = $("#dlg"), cur = String(t.type || "").trim();
  let sel = cur ? -1 : 0;
  for (let i = FILAMENTS.length - 1; i >= 0; i--) if (FILAMENTS[i][2].toUpperCase() === cur.toUpperCase()) sel = i;
  $("#dlgBody").innerHTML = `<div style="font-size:18px;font-weight:650;margin-bottom:14px">${t.slot === 254 ? "External spool" : `AMS ${t.unit} · slot ${t.tray}`}</div>
    <input type="text" id="eQ" placeholder="Search materials, e.g. CF, silk, nylon" style="width:100%;margin-bottom:8px">
    <select id="eT" style="width:100%;margin-bottom:8px"></select>
    <input type="text" id="eX" maxlength="16" placeholder="Type name, e.g. PLA-LED" style="width:100%;margin-bottom:8px" class="hide">
    <div class="mu sm" id="eInfo" style="margin-bottom:12px"></div>
    <div class="row" style="margin-bottom:10px"><span style="width:90px">Color</span><input type="color" id="eC" value="${t.color || "#ffffff"}" style="width:60px;height:40px;border:0;background:none"></div>
    <div class="row" style="margin-bottom:16px"><span style="width:90px">Nozzle °C</span><input type="number" id="eMin" style="width:80px" min="150" max="300"> – <input type="number" id="eMax" style="width:80px" min="150" max="300"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn sm" id="eNo">Cancel</button><button class="btn sm pri" id="eOk">Save</button></div>`;
  const fill = () => {
    const q = $("#eQ").value.trim().toLowerCase();
    let html = "", fam = null;
    FILAMENTS.forEach((r, i) => {
      if (q && !(r[0] + " " + r[1] + " " + r[2]).toLowerCase().includes(q)) return;
      if (r[0] !== fam) { if (fam !== null) html += "</optgroup>"; fam = r[0]; html += `<optgroup label="${esc(fam)}">`; }
      html += `<option value="${i}"${i === sel ? " selected" : ""}>${esc(r[1])}</option>`;
    });
    if (fam !== null) html += "</optgroup>";
    html += `<optgroup label="Anything else"><option value="-1"${sel < 0 ? " selected" : ""}>Other (type your own)</option></optgroup>`;
    $("#eT").innerHTML = html;
  };
  const show = setTemps => {
    $("#eX").classList.toggle("hide", sel >= 0);
    if (sel >= 0) {
      const r = FILAMENTS[sel];
      $("#eInfo").textContent = `Sent to the printer as ${r[2]} · suggested ${r[3]}–${r[4]}°C`;
      if (setTemps) { $("#eMin").value = r[3]; $("#eMax").value = r[4]; }
    } else $("#eInfo").textContent = "Any name up to 16 letters. Set the temperatures yourself (150–300°C).";
  };
  fill();
  if (sel < 0) $("#eX").value = cur;
  $("#eMin").value = sel >= 0 ? FILAMENTS[sel][3] : 200; $("#eMax").value = sel >= 0 ? FILAMENTS[sel][4] : 240;
  show(false);
  $("#eQ").oninput = () => { fill(); const v = +$("#eT").value; if (v !== sel) { sel = v; show(true); } };
  $("#eT").onchange = () => { sel = +$("#eT").value; show(true); };
  $("#eNo").onclick = () => d.close();
  $("#eOk").onclick = () => {
    let type, idx, name;
    if (sel < 0) { type = $("#eX").value.trim().toUpperCase(); idx = ""; name = type; if (!type) return toast("Type a material name"); }
    else { const r = FILAMENTS[sel]; type = r[2]; idx = r[5]; name = r[1]; }
    const mn = +$("#eMin").value, mx = +$("#eMax").value;
    if (!(mn >= 150 && mx <= 300 && mn <= mx)) return toast("Temperatures must be 150–300°C, min below max");
    d.close();
    cmd("ams_setting", {slot: t.slot, type, idx, color: $("#eC").value, min: mn, max: mx}, "Slot set to " + name);
  };
  d.showModal();
}

// ---------- spaghetti photo upload (resized here so each one stays small)
function uploadPhotos(done) {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*"; inp.multiple = true;
  inp.onchange = async () => {
    const files = [...inp.files], msg = $("#phMsg");
    let ok = 0, bad = 0;
    for (const [k, f] of files.entries()) {
      msg.textContent = `Uploading ${k + 1} of ${files.length}...`;
      try {
        const bmp = await createImageBitmap(f);
        const sc = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(bmp.width * sc); cv.height = Math.round(bmp.height * sc);
        cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
        const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.85));
        const r = await fetch(BASE + "/api/train/photo", {method: "POST", credentials: "same-origin", headers: {"X-PW": "1", "Content-Type": "image/jpeg"}, body: blob});
        const j = await r.json().catch(() => ({}));
        if (!r.ok || j.ok === false) throw new Error(j.error || "HTTP " + r.status);
        ok++;
      } catch (e) { bad++; toast(f.name + ": " + e.message); }
    }
    msg.textContent = `${ok} added${bad ? ", " + bad + " failed" : ""}. Your model retrains in about 20 seconds.`;
    done && done();
  };
  inp.click();
}

// ---------- 3D toolpath preview (cached per file + plate while the page is open)
const _g3d = new Map();
async function load3d(f, plate) {
  const el = $("#p3d"), key = f.path + "#" + plate.index;
  if (!el) return;
  if (window._v3d) { window._v3d.destroy(); window._v3d = null; }
  let buf = _g3d.get(key);
  if (!buf) {
    let r;
    try { r = await fetch(`${BASE}/api/files/gcode3d?plate=${plate.index}&path=${encodeURIComponent(f.path)}`, {credentials: "same-origin"}); }
    catch (e) { el.innerHTML = '<div class="v3d-wait">Can\'t reach PrintView.</div>'; return; }
    if (!r.ok) { let m = "HTTP " + r.status; try { m = (await r.json()).error || m; } catch (e) {} el.innerHTML = `<div class="v3d-wait">${esc(m)}</div>`; return; }
    buf = await r.arrayBuffer();
    if (_g3d.size > 4) _g3d.delete(_g3d.keys().next().value);
    _g3d.set(key, buf);
  }
  if ($("#p3d") !== el) return;            // user moved on while it loaded
  window._v3d = PV3D.mount(el, buf);
  const i = window._v3d.info;
  if (i && $("#p3dInfo")) $("#p3dInfo").textContent = `${i.size.map(v => Math.round(v)).join(" × ")} mm · ${i.layers} layers`;
}

function colorDist(a, b) {
  const h = c => { c = (c || "").replace("#", ""); return c.length >= 6 ? [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)) : null; };
  const x = h(a), y = h(b); if (!x || !y) return 500;
  return Math.hypot(x[0] - y[0], x[1] - y[1], x[2] - y[2]);
}

// ---------- schedule picker (quick picks, day strip, big clock)
function fmtWhen(at) {
  const d = new Date(at * 1000), now = new Date(), tm = d.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
  const day = new Date(d.getFullYear(), d.getMonth(), d.getDate()), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((day - today) / 86400000);
  return (diff === 0 ? "Today" : diff === 1 ? "Tomorrow" : d.toLocaleDateString([], {weekday: "short", month: "short", day: "numeric"})) + " at " + tm;
}
function countdown(at) {
  let s = Math.max(0, Math.round(at - Date.now() / 1000)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h >= 24 ? Math.floor(h / 24) + "d " + (h % 24) + "h" : h ? h + "h " + String(m).padStart(2, "0") + "m" : m + "m";
}
setInterval(() => document.querySelectorAll(".cd[data-at]").forEach(e => e.textContent = countdown(+e.dataset.at)), 15000);
function schedPicker(box, onPick) {
  const h12 = !/^[0-2]\d:/.test(new Date(2020, 0, 1, 13).toLocaleTimeString([], {hour: "numeric", minute: "2-digit"})) ;
  let t = new Date(Date.now() + 3600e3); t.setMinutes(Math.ceil(t.getMinutes() / 5) * 5, 0, 0);
  const quick = [["In 1 hour", () => new Date(Date.now() + 3600e3)], ["In 3 hours", () => new Date(Date.now() + 3 * 3600e3)],
    ["Tonight 10 PM", () => { const d = new Date(); d.setHours(22, 0, 0, 0); if (d < Date.now()) d.setDate(d.getDate() + 1); return d; }],
    ["Tomorrow 7 AM", () => { const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(7, 0, 0, 0); return d; }],
    ["Tomorrow noon", () => { const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(12, 0, 0, 0); return d; }]];
  const draw = () => {
    const days = [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() + i); return d; });
    let hh = t.getHours(), pm = hh >= 12, hd = h12 ? (hh % 12 || 12) : hh;
    box.innerHTML = `<div class="ttl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Schedule for later</div>
      <div class="qrow">${quick.map((q, i) => `<button class="q" data-q="${i}">${q[0]}</button>`).join("")}</div>
      <div class="days">${days.map((d, i) => `<div class="day${d.toDateString() === t.toDateString() ? " on" : ""}" data-d="${i}"><small>${i === 0 ? "Today" : d.toLocaleDateString([], {weekday: "short"})}</small><b>${d.getDate()}</b></div>`).join("")}</div>
      <div class="clock"><div class="spin"><button data-s="h+">\u25B2</button><output>${String(hd).padStart(2, "0")}</output><button data-s="h-">\u25BC</button></div><span class="colon">:</span>
        <div class="spin"><button data-s="m+">\u25B2</button><output>${String(t.getMinutes()).padStart(2, "0")}</output><button data-s="m-">\u25BC</button></div>
        ${h12 ? `<div class="ampm"><button data-ap="am" class="${pm ? "" : "on"}">AM</button><button data-ap="pm" class="${pm ? "on" : ""}">PM</button></div>` : ""}</div>
      <div class="when"><b>${fmtWhen(t / 1000)}</b><span>in ${countdown(t / 1000)}</span><button class="btn sm pri" id="sGo">Schedule</button></div>`;
    box.querySelectorAll("[data-q]").forEach(b => b.onclick = () => { t = quick[+b.dataset.q][1](); draw(); });
    box.querySelectorAll("[data-d]").forEach(b => b.onclick = () => { const d = days[+b.dataset.d]; t.setFullYear(d.getFullYear(), d.getMonth(), d.getDate()); draw(); });
    box.querySelectorAll("[data-s]").forEach(b => b.onclick = () => {
      const k = b.dataset.s; if (k === "h+") t.setHours(t.getHours() + 1); if (k === "h-") t.setHours(t.getHours() - 1);
      if (k === "m+") t.setMinutes(t.getMinutes() + 5 - t.getMinutes() % 5); if (k === "m-") t.setMinutes(t.getMinutes() - (t.getMinutes() % 5 || 5));
      draw();
    });
    box.querySelectorAll("[data-ap]").forEach(b => b.onclick = () => { const want = b.dataset.ap === "pm"; if (want !== (t.getHours() >= 12)) t.setHours(t.getHours() + (want ? 12 : -12)); draw(); });
    box.querySelector("#sGo").onclick = () => { if (t < Date.now() + 30e3) return toast("Pick a time in the future"); onPick(Math.round(t / 1000)); };
  };
  draw();
}

    $("#phDel").onclick = () => confirmBox("Delete all uploaded photos?", "Your model forgets them at the next training.", "Delete", async () => {
      try { await api("/api/prints/photos/delete", {}); toast("Deleted"); this.loadPhotos(); } catch (e) { toast(e.message); }

  async loadPhotos() {

  update(s) { if (s.settings && document.activeElement !== $("#trUse")) $("#trUse").checked = s.settings.use_custom !== false; },
  async loadModel() {
    try {
      const s = await api("/api/train"), c = s.counts || {}, r = s.report;
      const ok = s.trained && r && r.ok;
      $("#trBadge").textContent = ok ? "TRAINED" : "NOT YET"; $("#trBadge").style.color = ok ? "var(--ok)" : "var(--mu)";
      let txt = `Failed prints ${c.failed || 0}/${s.min_failed}   Good prints ${c.good || 0}/${s.min_good}` + (c.review ? `\n${c.review} to review` : "");
      if (ok && r.cv) {
        const f = x => x ? `caught ${x.caught ?? "?"}/${x.failed ?? "?"} failures, ${x.false_alarms ?? "?"} false alarms` : "-";
        txt += `\n\nOn your own prints (cross-validated):\nYour model: ${f(r.cv)}\nObico stock: ${f(r.obico)}`;
      }
      $("#trInfo").textContent = txt;
      $("#trState").textContent = s.running ? "Training..." : s.error ? "Error: " + s.error : r && r.trained_at ? "Last run " + new Date(r.trained_at * 1000).toLocaleString() : "";
      $("#trNow").disabled = !!s.running;
      if (s.running) setTimeout(() => tab === "train" && this.loadModel(), 2000);
    } catch (e) { $("#trInfo").textContent = e.message; }
  },
  async loadList() {
    try {
      const j = await api("/api/prints"), all = (Array.isArray(j) ? j : j.list || []).sort((a, b) => b.started - a.started);
      const keep = all.filter(m => trFilter === "all" || (trFilter === "review" ? (!m.label && m.status !== "recording") : m.label === trFilter));
      $("#trList").innerHTML = keep.length ? keep.map(m => `<div style="cursor:pointer" data-id="${esc(m.id)}">

        <div class="grow"><div style="font-weight:600">${esc(m.job)}</div><div class="fa sm">${new Date(m.started * 1000).toLocaleString()} · ${m.n} frames${m.end_state ? " · " + esc(m.end_state.toLowerCase()) : ""}${m.status === "recording" ? " · recording" : ""}</div></div>
        <span class="chip" style="color:${m.label === "failed" ? "var(--bad)" : m.label === "good" ? "var(--ok)" : "var(--mu)"}">${m.label || (m.status === "recording" ? "recording" : "review")}</span></div>`).join("")
        : `<div class="mu">${trFilter === "review" ? "Nothing to review. Failed, stopped or flagged prints show up here." : "None yet."}</div>`;
      $("#trList").querySelectorAll("[data-id]").forEach(r => r.onclick = () => this.review(r.dataset.id));
    } catch (e) { $("#trList").innerHTML = `<div style="color:var(--bad)">${esc(e.message)}</div>`; }
  },
  async review(id) {
    const box = $("#trRev");
    box.innerHTML = '<div class="card mu">Loading...</div>';
    box.scrollIntoView({behavior: "smooth"});
    try {
      const d = await api("/api/prints/" + encodeURIComponent(id)), m = d.meta, n = (d.ticks || []).length || m.n;
      if (!n) { box.innerHTML = '<div class="card mu">This print has no frames.</div>'; return; }
      let idx = m.fail_start != null ? m.fail_start : Math.floor(n / 2);
      box.innerHTML = `<div class="card"><div style="font-weight:650;font-size:17px">${esc(m.job)}</div>
        <div class="mu sm" style="margin-bottom:10px">${n} frames, one every 10 s. Drag to the first frame where it went wrong.</div>
        <img id="rvImg" style="width:100%;aspect-ratio:16/9;object-fit:contain;background:#000;border-radius:14px">
        <input type="range" id="rvR" min="0" max="${n - 1}" value="${idx}" style="margin-top:10px"><div class="mu sm num" id="rvT"></div>
        <div class="row w" style="margin-top:12px"><button class="btn bad" id="rvFail">Failure started here</button><button class="btn go" id="rvGood">Whole print was fine</button>
        <button class="btn sm" id="rvIgn">Ignore</button><button class="btn sm" id="rvDel" style="margin-left:auto">Delete</button></div></div>`;
      const show = () => { idx = +$("#rvR").value; $("#rvImg").src = `${BASE}/api/prints/${encodeURIComponent(id)}/frame/${idx}`; const t = idx * 10; $("#rvT").textContent = `Frame ${idx + 1}/${n} · ${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")} into the print`; };
      $("#rvR").oninput = show; show();
      const label = async (lab, extra) => { try { await api(`/api/prints/${encodeURIComponent(id)}/label`, Object.assign({label: lab}, extra || {})); toast("Saved. Retraining in about 20 s."); box.innerHTML = ""; this.loadList(); this.loadModel(); } catch (e) { toast(e.message); } };
      $("#rvFail").onclick = () => label("failed", {fail_start: idx});
      $("#rvGood").onclick = () => label("good");
      $("#rvIgn").onclick = () => label("ignore");
      $("#rvDel").onclick = () => confirmBox("Delete this recording?", "Its frames and features are removed from training.", "Delete", async () => {
        try { await api(`/api/prints/${encodeURIComponent(id)}/delete`, {}); box.innerHTML = ""; this.loadList(); this.loadModel(); } catch (e) { toast(e.message); }
      }, true);
    } catch (e) { box.innerHTML = `<div class="card" style="color:var(--bad)">${esc(e.message)}</div>`; }
  }
};

// ---------- Data flow (master code only): live Arduino, printer and web traffic through the Pi
const FLOW = [["p1s", "Pi ↔ P1S (MQTT)"], ["uno", "Pi ↔ Arduino (bed relay)"], ["web", "Web ↔ Pi"]];
VIEWS.flow = {
  seq: 0, lines: {p1s: [], uno: [], web: []}, paused: false, timer: null, hide: {}, filter: "",
  build(el) {
    el.innerHTML = `<div class="card"><div class="row"><div class="grow mu sm">Live traffic through the Pi, newest at the bottom. <span style="color:var(--ok)">Green</span> = into the Pi, <span style="color:var(--ac)">amber</span> = out of the Pi.</div></div>
      <div class="row" style="margin-top:10px;gap:6px"><input id="flF" placeholder="Filter (e.g. gcode_state, ams, temp)" class="grow"><button class="btn sm" id="flP">Pause</button><button class="btn sm" id="flC">Clear</button></div></div>
      ${FLOW.map(([k, t]) => `<div class="card"><div class="row" style="cursor:pointer" data-fh="${k}"><div class="h grow" style="margin:0">${t}</div><span class="chip" id="flN-${k}">0</span></div>
        <pre id="flB-${k}" class="flow"></pre></div>`).join("")}`;
    $("#flP").onclick = () => { this.paused = !this.paused; $("#flP").textContent = this.paused ? "Resume" : "Pause"; if (!this.paused) this.paint(); };
    $("#flC").onclick = () => { for (const k in this.lines) this.lines[k] = []; this.paint(); };
    $("#flF").value = this.filter;
    $("#flF").oninput = e => { this.filter = e.target.value.toLowerCase(); this.paint(); };
    el.querySelectorAll("[data-fh]").forEach(h => h.onclick = () => { const k = h.dataset.fh; this.hide[k] = !this.hide[k]; $("#flB-" + k).style.display = this.hide[k] ? "none" : ""; });
    for (const k in this.hide) if (this.hide[k]) $("#flB-" + k).style.display = "none";
    this.paint(); this.poll();
  },
  async poll() {
    clearTimeout(this.timer);
    if (tab !== "flow") return;
    try {
      const j = await api("/api/streams?since=" + this.seq);
      this.seq = j.seq || this.seq;
      for (const [k] of FLOW) for (const r of (j.streams && j.streams[k]) || []) { this.lines[k].push(r); if (this.lines[k].length > 300) this.lines[k].shift(); }
      if (!this.paused) this.paint();
    } catch (e) {}
    this.timer = setTimeout(() => this.poll(), 1000);
  },
  paint() {
    for (const [k] of FLOW) {
      const b = $("#flB-" + k); if (!b) return;
      const f = this.filter, rows = this.lines[k].filter(r => !f || r.s.toLowerCase().includes(f)).slice(-120);
      const stick = b.scrollTop + b.clientHeight >= b.scrollHeight - 30;
      b.innerHTML = rows.length ? rows.map(r => { const out = /^Pi\s*>/.test(r.s);
        return `<span class="fa">${new Date(r.t * 1000).toLocaleTimeString([], {hour12: false})}</span> <span style="color:${out ? "var(--ac)" : "var(--ok)"}">${esc(r.s)}</span>`; }).join("\n") : '<span class="mu">Waiting for data...</span>';
      $("#flN-" + k).textContent = this.lines[k].length;
      if (stick) b.scrollTop = b.scrollHeight;
    }
  }
};

      $("#aList").querySelectorAll("[data-kick]").forEach(b => b.onclick = async () => { try { await api("/admin/kick", {id: b.dataset.kick}); toast("Logged out"); this.load(); } catch (e) { toast(e.message); } });
      const ex = await api("/admin/exercise");
      $("#exChip").textContent = ex.running ? "running" : "off"; $("#exChip").style.color = ex.running ? "var(--ok)" : "";
      $("#exGo").disabled = ex.running; $("#exStop").disabled = !ex.running;
      $("#exSet").classList.toggle("hide", ex.running);
      if (ex.running) $("#exTxt").textContent = `${ex.passes} back-and-forths so far · ${mins(ex.left_s / 60)} left · ${ex.speed} mm/s between Y${ex.range[0]} and Y${ex.range[1]}`;
      else if (ex.reason) $("#exTxt").textContent = `Last run: ${ex.passes} back-and-forths, ${ex.reason}${ex.stopped ? " at " + new Date(ex.stopped * 1000).toLocaleTimeString([], {hour: "numeric", minute: "2-digit"}) : ""}.`;
      const v = (await api("/admin/visitors")).visitors || [];
      const when = t => { const d = new Date(t * 1000); return d.toLocaleDateString([], {month: "short", day: "numeric"}) + " " + d.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"}); };
      const spots = {};
      v.forEach(r => { if (r.lat == null || r.lon == null) return; const k = r.place || (r.lat + "," + r.lon);
        const s = spots[k] || (spots[k] = {lat: r.lat, lon: r.lon, place: r.place || "", n: 0}); s.n++; });
      const sp = Object.values(spots).sort((a, b) => b.n - a.n);
      $("#aVCount").textContent = v.length + (v.length === 1 ? " device" : " devices");
      $("#aDots").innerHTML = sp.map(s => `<circle data-r="${Math.min(14, 3.5 + Math.sqrt(s.n) * 2).toFixed(1)}" cx="${((s.lon + 180) * 2).toFixed(1)}" cy="${((90 - s.lat) * 2).toFixed(1)}" r="${Math.min(14, 3.5 + Math.sqrt(s.n) * 2).toFixed(1)}" fill="var(--ac)" fill-opacity=".75" stroke="#fff" stroke-width="1"><title>${esc(s.place)}: ${s.n}</title></circle>`).join("");
      mapZoom();
      $("#aMapTxt").textContent = sp.length ? "Top: " + sp.slice(0, 5).map(s => `${s.place.split(", ").slice(0, 1).concat(s.place.split(", ").slice(-1)).filter((x, i, a) => a.indexOf(x) === i).join(", ")} (${s.n})`).join(" · ") : "Dots appear as visitor locations are looked up.";
      $("#aVis").innerHTML = v.length ? v.map(r => `<div style="align-items:flex-start"><div class="grow">
          <div class="row" style="gap:8px"><a href="https://ipinfo.io/${encodeURIComponent(r.ip)}" target="_blank" rel="noopener noreferrer" style="font-weight:650" class="num">${esc(r.ip)}</a>
            ${r.role ? `<span class="chip" style="color:${r.role === "master" ? "var(--ac)" : "var(--ok)"}">${r.role}</span>` : '<span class="chip">viewer</span>'}
            ${r.locked_s > 0 ? `<span class="chip" style="color:var(--bad)">locked ${Math.ceil(r.locked_s / 60)} min</span>` : ""}</div>
          <div class="sm" style="margin-top:3px">${esc(r.place || "Location: looking up...")}</div>
          <div class="sm">${esc(r.device)}</div>
          <div class="fa sm">First ${when(r.first)} · last ${ago(Math.max(0, Date.now() / 1000 - r.last))}</div>
          <div class="fa sm">Opened ${r.opens}× · watched ${r.watch_min} min · right codes ${r.ok} · wrong codes <span style="${r.bad ? "color:var(--bad)" : ""}">${r.bad}</span></div>
          <details class="fa sm" style="margin-top:2px"><summary style="cursor:pointer">Browser details</summary><div style="word-break:break-all">${esc(r.ua || "none sent")}</div></details>
        </div></div>`).join("") : '<div class="mu">Nobody yet.</div>';
    } catch (e) { $("#aList").innerHTML = `<div style="color:var(--bad)">${esc(e.message)}</div>`; }
  }
};

// ------------------------------------------------------------ visitor map: drag to move, wheel / pinch / buttons to zoom
function mapZoom() {
  const svg = $("#aMap");
  if (!svg) return;
  const W = 720, H = 360, MAXZ = 24;
  if (!svg._v) svg._v = {x: 0, y: 0, w: W};
  const v = svg._v;
  const draw = () => {
    v.w = Math.min(W, Math.max(W / MAXZ, v.w));
    const h = v.w / 2;
    v.x = Math.min(W - v.w, Math.max(0, v.x)); v.y = Math.min(H - h, Math.max(0, v.y));
    svg.setAttribute("viewBox", `${v.x} ${v.y} ${v.w} ${h}`);
    const k = v.w / W;                               // keep dots the same size on screen
    svg.querySelectorAll("circle").forEach(c => { c.setAttribute("r", (+c.dataset.r * Math.max(k, 0.25)).toFixed(2)); c.setAttribute("stroke-width", k); });
  };
  const zoomAt = (f, px, py) => {                    // px,py: 0..1 position on the map
    const nw = Math.min(W, Math.max(W / MAXZ, v.w / f));
    v.x += (v.w - nw) * px; v.y += (v.w - nw) / 2 * py; v.w = nw; draw();
  };
  svg._draw = draw;
  if (!svg._wired) {
    svg._wired = true;
    const box = document.createElement("div");      // zoom buttons over the map's top-right corner
    box.style.cssText = "position:relative;margin-top:10px";
    svg.parentNode.insertBefore(box, svg); box.appendChild(svg);
    svg.style.marginTop = "0"; svg.style.touchAction = "none"; svg.style.cursor = "grab";
    box.insertAdjacentHTML("afterbegin", '<div style="position:absolute;right:8px;top:8px;display:flex;gap:6px;z-index:1"><button class="btn sm" id="mzIn" aria-label="Zoom in">+</button><button class="btn sm" id="mzOut" aria-label="Zoom out">&minus;</button><button class="btn sm" id="mzReset">Reset</button></div>');
    const pos = e => { const r = svg.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height, r.width]; };
    svg.addEventListener("wheel", e => { e.preventDefault(); const [px, py] = pos(e); zoomAt(e.deltaY < 0 ? 1.25 : 0.8, px, py); }, {passive: false});
    const pts = new Map(); let last = null, pinch = null;
    svg.addEventListener("pointerdown", e => { svg.setPointerCapture(e.pointerId); pts.set(e.pointerId, e); last = e; svg.style.cursor = "grabbing"; });
    svg.addEventListener("pointermove", e => {
      if (!pts.has(e.pointerId)) return;
      pts.set(e.pointerId, e);
      if (pts.size === 2) {
        const [a, b] = [...pts.values()], d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
        const mid = {clientX: (a.clientX + b.clientX) / 2, clientY: (a.clientY + b.clientY) / 2};
        if (pinch) { const [px, py] = pos(mid); zoomAt(d / pinch, px, py); }
        pinch = d; return;
      }
      if (last) { const [, , rw] = pos(e); v.x -= (e.clientX - last.clientX) * v.w / rw; v.y -= (e.clientY - last.clientY) * v.w / rw; draw(); }
      last = e;
    });
    const up = e => { pts.delete(e.pointerId); pinch = null; last = pts.size ? [...pts.values()][0] : null; svg.style.cursor = "grab"; };
    svg.addEventListener("pointerup", up); svg.addEventListener("pointercancel", up);
    svg.addEventListener("dblclick", e => { const [px, py] = pos(e); zoomAt(2, px, py); });
    $("#mzIn").onclick = () => zoomAt(1.6, .5, .5);
    $("#mzOut").onclick = () => zoomAt(1 / 1.6, .5, .5);
    $("#mzReset").onclick = () => { v.x = 0; v.y = 0; v.w = W; draw(); };
  }
  draw();
}

// ------------------------------------------------------------ start
document.addEventListener("visibilitychange", () => { if (!document.hidden && unlocked) poll(); });
(async () => {
  try { const me = await (await fetch(BASE + "/me", {cache: "no-store"})).json(); frozen = !!me.frozen; setUnlocked(!!me.unlocked, me.role); }
  catch (e) { setUnlocked(false); }
})();
</script>
<script>window.VFX_IMG="#img";window.VFX_BOX="#cam";</script>
<script>
/* Video settings: per-viewer look of the camera feed (saved in this browser only). */
(function(){
  const IMG = document.querySelector(window.VFX_IMG), BOX = document.querySelector(window.VFX_BOX);
  if (!IMG || !BOX) return;
  const KEY = "pw_vfx", D = {bright:100, contrast:100, sat:100, hue:0, gray:false, invert:false, sepia:false, flipH:false, flipV:false, zoom:100, night:false};
  let v = Object.assign({}, D);
  try { Object.assign(v, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} };
  function apply(){
    const f = [`brightness(${v.bright}%)`, `contrast(${v.contrast}%)`, `saturate(${v.sat}%)`, `hue-rotate(${v.hue}deg)`];
    if (v.gray) f.push("grayscale(1)");
    if (v.sepia) f.push("sepia(1)");
    if (v.invert) f.push("invert(1)");
    if (v.night) f.push("grayscale(1) sepia(1) hue-rotate(70deg) saturate(3) brightness(1.2)");
    IMG.style.filter = f.join(" ");
    IMG.style.transform = `scale(${(v.flipH?-1:1)*v.zoom/100}, ${(v.flipV?-1:1)*v.zoom/100})`;
    IMG.style.transformOrigin = "center";
    BOX.style.overflow = "hidden";
  }
  const btn = document.createElement("button");
  btn.type = "button"; btn.title = "Video settings"; btn.textContent = "⚙";
  btn.style.cssText = "position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:5;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:20px;cursor:pointer";
  if (getComputedStyle(BOX).position === "static") BOX.style.position = "relative";
  BOX.appendChild(btn);
  const p = document.createElement("div");
  p.style.cssText = "display:none;position:fixed;right:16px;top:70px;z-index:99;width:min(320px,calc(100vw - 32px));max-height:80vh;overflow:auto;background:#16181d;color:#eee;border:1px solid #333;border-radius:14px;padding:14px 16px;font:14px system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.5)";
  const sl = (k,l,min,max,u) => `<label style="display:block;margin:8px 0">${l} <span id="vfx_${k}_v" style="float:right;opacity:.7"></span><input type="range" min="${min}" max="${max}" data-k="${k}" data-u="${u}" style="width:100%"></label>`;
  const ck = (k,l) => `<label style="display:inline-flex;gap:6px;align-items:center;margin:6px 12px 6px 0"><input type="checkbox" data-k="${k}">${l}</label>`;
  p.innerHTML = `<div style="display:flex;align-items:center;margin-bottom:6px"><b style="flex:1">Video settings</b><button type="button" id="vfx_x" style="background:none;border:0;color:#aaa;font-size:20px;cursor:pointer">×</button></div>
    ${sl("bright","Brightness",20,250,"%")}${sl("contrast","Contrast",20,250,"%")}${sl("sat","Saturation",0,300,"%")}${sl("hue","Hue shift",0,360,"°")}${sl("zoom","Zoom",100,400,"%")}
    <div>${ck("gray","Greyscale")}${ck("invert","Invert colors")}${ck("sepia","Sepia")}${ck("night","Night vision")}${ck("flipH","Flip sideways")}${ck("flipV","Flip upside down")}</div>
    <button type="button" id="vfx_r" style="width:100%;margin-top:10px;padding:9px;border-radius:10px;border:0;background:#2a2d35;color:#eee;cursor:pointer">Reset</button>
    <div style="font-size:12px;opacity:.6;margin-top:8px">Only changes what you see on this device.</div>`;
  document.body.appendChild(p);
  function sync(){
    p.querySelectorAll("[data-k]").forEach(el => {
      const k = el.dataset.k;
      if (el.type === "checkbox") el.checked = !!v[k];
      else { el.value = v[k]; p.querySelector(`#vfx_${k}_v`).textContent = v[k] + el.dataset.u; }
    });
    apply();
  }
  p.addEventListener("input", e => {
    const el = e.target, k = el.dataset && el.dataset.k; if (!k) return;
    v[k] = el.type === "checkbox" ? el.checked : +el.value; save(); sync();
  });
  btn.onclick = e => { e.stopPropagation(); p.style.display = p.style.display === "none" ? "block" : "none"; };
  p.querySelector("#vfx_x").onclick = () => p.style.display = "none";
  p.querySelector("#vfx_r").onclick = () => { v = Object.assign({}, D); save(); sync(); };
  sync();
})();
</script>
